[project]
name = "yeat-gpt"
version = "0.3.0"
description = "Conversational Yeat persona: lyrics plus general instruct data, trained with QLoRA"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "lxml>=6.0.2",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0",
    "tqdm>=4.67.1",
    "typer>=0.20.0",
]

[project.optional-dependencies]
general = [
    "datasets>=3.0.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.14.0",
]

[project.scripts]
yeat-gpt = "yeat_gpt.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yeat_gpt"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
