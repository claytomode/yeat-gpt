# Near-prod default when GPU memory is at least 16GB (Colab L4, A100, or a 24GB rental).
base_model: unsloth/Qwen2.5-7B-Instruct
max_seq_length: 2048
lora_r: 32
lora_alpha: 32
lora_dropout: 0
learning_rate: 1.0e-4
epochs: 1
per_device_batch_size: 1
gradient_accumulation_steps: 8
optim: adamw_8bit
lr_scheduler_type: cosine
warmup_ratio: 0.05
packing: false
