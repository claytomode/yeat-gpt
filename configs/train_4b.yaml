# Free Colab T4 fallback when GPU memory is under 16GB.
# If 2048 OOMs on a T4, drop max_seq_length to 1024. The value stays 2048.
base_model: unsloth/Qwen3-4B-Instruct-2507
max_seq_length: 2048
lora_r: 32
lora_alpha: 32
lora_dropout: 0
learning_rate: 1.0e-4
epochs: 1
per_device_batch_size: 1
gradient_accumulation_steps: 8
optim: adamw_8bit
lr_scheduler_type: cosine
warmup_ratio: 0.05
packing: false
